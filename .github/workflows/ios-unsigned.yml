name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - codemagic.yaml

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Verify native libraries and Xcode
        run: |
          set -euo pipefail
          git lfs fsck
          xcodebuild -version
      - name: Build unsigned archive
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild archive \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/build/NroChill.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee build/xcodebuild.log
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$GITHUB_WORKSPACE/build/NroChill.xcarchive/Products/Applications/NroChill.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          ditto "$APP_PATH" build/ipa/Payload/NroChill.app
          cd build/ipa
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/build/NroChill-unsigned.ipa" Payload
          unzip -t "$GITHUB_WORKSPACE/build/NroChill-unsigned.ipa"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NroChill-unsigned-IPA
          path: build/NroChill-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
